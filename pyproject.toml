[tool.poetry]
name = "raiz-gerenciamento-de-tarefas"
version = "0.1.0"
description = "Projeto de gerenciamento de tarefas"
authors = ["Mantenedores do projeto"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
fastapi = "==0.115.0"
pydantic = "==2.10.0"
SQLAlchemy = "==2.0.36"
asyncpg = "==0.30.0"
uvicorn = { version = "==0.32.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
black = "==25.11.0"
httpx = "==0.28.1"
pytest = "==8.4.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
