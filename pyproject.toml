[tool.poetry]
name = "raiz-gerenciamento-de-tarefas"
version = "0.1.0"
description = "Projeto de gerenciamento de tarefas"
authors = ["Mantenedores do projeto"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
SQLAlchemy = "==3.3.6"
pydantic = "==2.14.1"
psycopg = { version = "==2.1.4", extras = ["binary"] }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
